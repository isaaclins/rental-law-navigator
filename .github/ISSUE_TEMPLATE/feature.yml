name: Feature
description: Propose a new capability or an improvement
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards, and for whom (renter, judge, team)?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Module A - rule extraction
        - Module B - jurisdiction resolution / address lookup
        - Module C - change tracking
        - Web UI / plain-language view
        - CI / tooling
        - Docs / demo
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done? Prefer checks the selfcheck or CI can verify.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scoring
    attributes:
      label: Scoring impact
      description: Which judging criterion does this improve?
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Sources, links, open questions.
