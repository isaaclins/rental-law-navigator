<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline · Clause &amp; Effect</title>
<link rel="icon" href="/static/icons/favicon-32.png">
<style>
:root { --label: #1d1d1f; --label-2: #6e6e73; --sep: #e8e8ed; --accent: #0066cc; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--label); background: #fff; -webkit-font-smoothing: antialiased; }
main { width: min(440px, 100%); text-align: center; }
h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
p { color: var(--label-2); margin: 0 0 24px; }
button { border: 0; border-radius: 10px; min-height: 44px; padding: 0 20px; font: 500 15px inherit; font-family: inherit; background: var(--accent); color: #fff; cursor: pointer; }
ul { list-style: none; padding: 0; margin: 32px 0 0; text-align: left; border-top: 1px solid var(--sep); }
li { border-bottom: 1px solid var(--sep); }
li a { display: block; padding: 12px 0; color: var(--label); text-decoration: none; }
li small { display: block; color: var(--label-2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Saved answers still open. Everything else returns with the connection.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <ul id="saved" aria-label="Saved answers"></ul>
</main>
<script>
// list the answers the service worker kept (newest first)
(async () => {
  if (!("caches" in self)) return;
  const c = await caches.open("ce-answers-v1");
  const seen = new Set();
  for (const k of (await c.keys()).reverse()) {
    const id = new URL(k.url).pathname.split("/").pop();
    if (seen.has(id)) continue;
    seen.add(id);
    const d = await (await c.match(k)).json().catch(() => null);
    const a = d && d.address;
    if (!a) continue;
    const li = document.createElement("li");
    li.innerHTML = '<a></a>';
    li.firstChild.href = "/#/a/" + id;
    li.firstChild.textContent = String(a.street_address).toLowerCase().replace(/\b\w/g, (m) => m.toUpperCase());
    const s = document.createElement("small");
    s.textContent = [a.postal_city, a.state].filter(Boolean).join(", ");
    li.firstChild.append(s);
    document.getElementById("saved").append(li);
  }
})();
</script>
</body>
</html>
