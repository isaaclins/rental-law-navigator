<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline · Clause &amp; Effect</title>
<link rel="icon" href="/static/icons/favicon-32.png" type="image/png">
<!-- Shown by the service worker (sw.js) only when a page request fails because there is no connection. Must work
     offline: inline CSS, fonts from the worker's cache, EN/ES like the app (localStorage "lang"). -->
<style>
@font-face { font-family: "Inter"; src: url("/static/fonts/InterVariable-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Instrument Serif"; src: url("/static/fonts/InstrumentSerif-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Instrument Serif"; src: url("/static/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
:root { --ink: #000c1f; --ink-2: rgb(0 12 31 / .66); --sep: rgb(0 12 31 / .14); --cool: #f3f5f8; --cool-2: #eaeef4; --navy: #002664; --navy-edge: #00163d;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --display: "Instrument Serif", "Times New Roman", Times, serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; font: 16px/1.5 var(--font); color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 16px max(20px, env(safe-area-inset-left)); }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; white-space: nowrap; }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font: 400 22px/1 var(--display); padding-bottom: 2px; box-shadow: 0 2px 0 var(--navy-edge); flex: none; }
.word { font: 400 27px/1 var(--display); }
.word i { color: var(--navy); }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--cool); }
.lang button { min-width: 44px; min-height: 36px; border: 0; border-radius: 999px; background: none; font: 600 13px/1 var(--font); color: var(--ink-2); cursor: pointer; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(0 12 31 / .12); }
main { flex: 1; display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left)); }
.panel { width: min(640px, 100%); padding: clamp(32px, 7vw, 64px) clamp(20px, 6vw, 56px); border-radius: 48px; background: linear-gradient(180deg, var(--cool), #fff); text-align: center; }
.eyebrow { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h1 { margin: 0; font: 400 clamp(2.6rem, 1.6rem + 4vw, 4.4rem)/.98 var(--display); letter-spacing: -.02em; overflow-wrap: break-word; }
p.lead { margin: 16px auto 0; max-width: 32ch; font-size: 18px; color: var(--ink-2); }
.acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; text-align: center;
  background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--sep), 0 3px 0 #d9dee6; margin-bottom: 3px; transition: transform .12s, box-shadow .12s, background-color .2s; -webkit-tap-highlight-color: transparent; }
.btn.primary { background: var(--navy); color: #fff; box-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 3px 0 var(--navy-edge), 0 8px 20px rgb(0 38 100 / .22); }
.btn.primary:hover { background: #0a3a8c; }
.btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 1px var(--sep); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn:focus-visible, .lang button:focus-visible, .brand:focus-visible { outline: 3px solid rgb(0 38 100 / .35); outline-offset: 2px; }
footer { padding: 0 20px max(20px, env(safe-area-inset-bottom)); text-align: center; font-size: 12.5px; color: var(--ink-2); }
.saved { width: min(640px, 100%); margin: 24px auto 0; text-align: left; }
.saved h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.saved ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--sep); }
.saved li { border-bottom: 1px solid var(--sep); }
.saved a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 4px; text-decoration: none; font-weight: 600; }
.saved small { display: block; font-weight: 400; font-size: 14px; color: var(--ink-2); }
.saved a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 420px) { .word { font-size: 23px; } .acts .btn { flex: 1 1 100%; } .panel { border-radius: 32px; } }
@media (max-width: 260px) { .word { display: none; } .btn { padding: 0 14px; } .panel { padding-left: 14px; padding-right: 14px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Clause and Effect, home"><span class="mark" aria-hidden="true">§</span><span class="word">Clause <i>&amp;</i> Effect</span></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" lang="es" aria-pressed="false">ES</button>
  </div>
</header>
<main>
  <div>
    <section class="panel">
      <p class="eyebrow" data-t="eyebrow">No connection</p>
      <h1 data-t="title">You're offline</h1>
      <p class="lead" data-t="lead">Answers you opened before still work. Everything else comes back when you're online.</p>
      <div class="acts">
        <button class="btn primary" type="button" id="retry" style="border:0;font-family:inherit;cursor:pointer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg><span data-t="retry">Retry</span></button>
      </div>
    </section>
    <section class="saved" id="saved" hidden>
      <h2 data-t="saved">Saved answers</h2>
      <ul></ul>
    </section>
  </div>
</main>
<footer data-t="nla">Housing law, quoted word for word from its sources. Not legal advice.</footer>
<script data-cfasync="false">
(function () {
  var T = {
    en: { doc: "Offline · Clause & Effect", eyebrow: "No connection", title: "You're offline",
      lead: "Answers you opened before still work. Everything else comes back when you're online.",
      retry: "Retry", saved: "Saved answers", nla: "Housing law, quoted word for word from its sources. Not legal advice." },
    es: { doc: "Sin conexión · Clause & Effect", eyebrow: "Sin conexión", title: "No tiene conexión",
      lead: "Las respuestas que ya abrió siguen disponibles. Lo demás vuelve cuando tenga conexión.",
      retry: "Reintentar", saved: "Respuestas guardadas", nla: "Ley de vivienda, citada palabra por palabra de sus fuentes. No es asesoría legal." },
  };
  function stored() { try { return localStorage.getItem("lang"); } catch (e) { return null; } }
  function apply(l) {
    var d = T[l] || T.en;
    document.documentElement.lang = l;
    document.title = d.doc;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = d[el.getAttribute("data-t")]; });
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l)); });
  }
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { var l = b.getAttribute("data-lang"); try { localStorage.setItem("lang", l); } catch (e) {} apply(l); });
  });
  apply(stored() || (/^es\b/i.test(navigator.language || "") ? "es" : "en"));
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  // back online: reload, unless the reader is already on the way to another page (a saved answer, the home page)
  var leaving = false;
  addEventListener("beforeunload", function () { leaving = true; });
  addEventListener("pageshow", function () { leaving = false; });
  addEventListener("online", function () { if (!leaving) location.reload(); });
})();
// the answers the service worker kept (newest first)
(async function () {
  if (!("caches" in self)) return;
  var c = await caches.open("ce-answers-v1");
  var seen = new Set(), box = document.getElementById("saved"), ul = box.querySelector("ul");
  for (var k of (await c.keys()).reverse()) {
    var id = new URL(k.url).pathname.split("/").pop();
    if (seen.has(id)) continue;
    seen.add(id);
    var d = await (await c.match(k)).json().catch(function () { return null; });
    var a = d && d.address;
    if (!a) continue;
    var li = document.createElement("li"), link = document.createElement("a"), txt = document.createElement("span"), s = document.createElement("small");
    link.href = "/#/a/" + id;
    txt.textContent = String(a.street_address).toLowerCase().replace(/\b\w/g, function (m) { return m.toUpperCase(); });
    s.textContent = [a.postal_city, a.state].filter(Boolean).join(", ");
    txt.append(s);
    link.append(txt);
    link.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>');
    li.append(link);
    ul.append(li);
    box.hidden = false;
  }
})();
</script>
</body>
</html>
